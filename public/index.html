<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nández Café">
  <title>Nández Café</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Computador: barra arriba. Celular: barra de pestañas abajo. Las dos se
       pintan desde el mismo lugar (pintarNav) y el CSS muestra la que toca. -->
  <header class="barra">
    <div class="cabecera">
      <a class="marca" href="#/resumen">☕ <span>Nández Café</span></a>
      <nav id="nav" aria-label="Secciones"></nav>
    </div>
  </header>
  <div id="subnav"></div>
  <main id="vista" tabindex="-1"></main>
  <nav id="pestanas" aria-label="Secciones"></nav>

  <dialog id="dialogo">
    <form method="dialog" id="form-dialogo" novalidate></form>
  </dialog>
  <dialog id="hoja" class="hoja" aria-labelledby="hoja-titulo"></dialog>

  <div id="aviso" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
