# Despliegue de Nández Café en Render (Blueprint).
#
# La base de datos es UN SOLO ARCHIVO (`cafe.db`), así que el disco es
# obligatorio: los servicios sin disco borran el archivo en cada despliegue o
# reinicio. Por eso este servicio va en plan de pago, no en el gratis.
#
# Las fotos y adjuntos también viven en el disco, en /data/uploads.

services:
  - type: web
    name: nandez-cafe
    runtime: node
    plan: starter
    region: virginia # el más cercano a Colombia de los de Render
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/salud # no pide clave, por eso sirve de chequeo

    disk:
      name: datos
      mountPath: /data
      sizeGB: 1 # de sobra: la base pesa menos de 1 MB por ahora

    envVars:
      # Render inyecta PORT automáticamente; no se define aquí.
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      # Lo que debe sobrevivir a los despliegues va en el disco.
      - key: DB_PATH
        value: /data/cafe.db
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: TIMEZONE
        value: America/Bogota
      - key: CLIMA_AUTO_HORAS
        value: "3"
      # Clave de acceso: Render genera una al crear el servicio. Se copia desde
      # el panel (Environment) y se pega en el celular la primera vez.
      - key: API_TOKEN
        generateValue: true
